# CitrusPi configuration
# Copy to config.yaml to override defaults.

# Sensor polling interval (seconds)
# 60 seconds gives great resolution and uses <0.1MB/day in SQLite.
poll_interval_sec: 60

# BME280 I2C address (0x76 or 0x77)
bme280_address: 0x76

# DS18B20 1-Wire devices directory (default: /sys/bus/w1/devices)
# w1_devices_dir: "/sys/bus/w1/devices"

# Force mock sensors (default false; true runs simulated telemetry)
mock_sensors: false

# Camera settings (1920x1080 default for Logitech C930e with hardware MJPG)
camera_device: "/dev/video0"
camera_device_index: 0
capture_width: 1920
capture_height: 1080

# Live preview is independent of the Full HD daily photo resolution.
stream_width: 1280
stream_height: 720

# Daily timelapse photo schedule
# Snaps 1 photo per day during the lights-on photoperiod (e.g. 22:00 = 10 PM if lights run overnight 20:00–06:00).
# Ensure daily_capture_hour falls during the tent's light cycle so images are well-illuminated.
daily_capture_hour: 22
daily_capture_minute: 0

# On-demand live stream framerate (keep low to save Pi Zero 2W CPU)
stream_fps: 5

# Maximum live stream session duration in seconds (default: 300 = 5 minutes)
stream_max_session_sec: 300

# Web server (port 80 allows opening http://citruspi.local directly)
host: "0.0.0.0"
port: 80
log_level: "info"

# Alerting & Heartbeats (ntfy.sh push notifications and dead-man's-snitch heartbeat ping)
# ntfy_topic and heartbeat_url can also be set via CITRUSPI_NTFY_TOPIC and CITRUSPI_HEARTBEAT_URL env vars.
ntfy_url: "https://ntfy.sh"
ntfy_topic: ""
heartbeat_url: ""

# Temperature thresholds (°F) and debounce count (consecutive readings required to trigger).
# NOTE: These thresholds assume the ~50°F winter phase and must be raised
# when the tent runs warmer (e.g. ~60°F staging).
temp_min_crit_f: 38.0
temp_min_warn_f: 44.0
temp_max_crit_f: 85.0
alert_debounce_count: 3

# AI Analysis (daily visual health analysis using Google Gemini; dashboard-only, never sends ntfy)
# ai_api_key can also be set via CITRUSPI_AI_API_KEY env var.
ai_enabled: false
ai_api_key: ""
ai_model: "gemini-3.8-flash"
# Optional names/positions matching the camera view; leave empty for findings by visible area.
plant_layout: ""

