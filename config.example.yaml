# CitrusPi configuration
# Copy to config.yaml and edit as needed.

# Sensor polling interval (seconds)
poll_interval_sec: 300

# BME280 I2C address (0x76 or 0x77)
bme280_address: 0x76

# Capacitive soil moisture I2C address
soil_moisture_address: 0x36

# Force mock sensors (set true for dev without hardware)
mock_sensors: false

# Camera
camera_device: "/dev/video0"
camera_device_index: 0
capture_interval_sec: 1800
capture_width: 1280
capture_height: 720

# LED photoperiod (captures only during these hours)
lights_on_hour: 7
lights_off_hour: 17

# Web server
host: "0.0.0.0"
port: 8000
log_level: "info"
