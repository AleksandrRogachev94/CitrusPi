# CitrusPi configuration
# Copy to config.yaml to override defaults.

# Sensor polling interval (seconds)
# 60 seconds gives great resolution and uses <0.1MB/day in SQLite.
poll_interval_sec: 60

# BME280 I2C address (0x76 or 0x77)
bme280_address: 0x76

# DS18B20 1-Wire devices directory (default: /sys/bus/w1/devices)
# w1_devices_dir: "/sys/bus/w1/devices"

# Force mock sensors (default false; true runs simulated telemetry)
mock_sensors: false

# Optional, read-only Kasa energy monitoring. Install with: pip install -e ".[plugs]"
# Use DHCP reservations for hosts. Keep ids stable to preserve equipment history.
# active/idle thresholds use watts; changes require two consecutive observations.
# No plug switching or device settings are changed. Mock mode pauses plug polling.
plug_poll_interval_sec: 60
plugs: []
# plugs:
#   - id: heater
#     name: Heater
#     role: heater
#     host: 192.168.1.230
#     active_watts: 10
#     idle_watts: 3
#   - id: light
#     name: Grow light
#     role: light
#     host: 192.168.1.229
#     active_watts: 5
#     idle_watts: 2
# Credentials for local authentication. Protect config.yaml with chmod 600.
# Environment overrides: CITRUSPI_KASA_USERNAME and CITRUSPI_KASA_PASSWORD.
kasa_username: ""
kasa_password: ""

# Optional electricity estimate for monitored plugs (USD per kWh).
# PECO residential TOU supply + transmission: June 1–November 30, 2026.
# Source: https://azure-na-assets.contentstack.com/v3/assets/blt1b5616c79bacadb4/bltf7c1eb06cdfe6ab9/6a0e7050df378b4731251e82/2026_RESIDENTIAL_Final_Electric_PTC_Effective_06-01-2026.pdf
# Verify against your bill; update rates when PECO changes them, then restart.
# PECO Rate R variable delivery: $0.10236/kWh, effective July 1, 2026.
# Delivery source: https://azure-na-assets.contentstack.com/v3/assets/blt1b5616c79bacadb4/bltef2bb157cc587eac/6a4541d70d15ec68610f09eb/Rate_R_from_clean_up_FARS_ICUS_Supp_no._32_Effective_July_1_2026.pdf
# delivery_rate adds the same variable delivery charge to every kWh.
# Set to 0 for supply only. Fixed monthly fees and other bill adjustments are excluded.
# Remove this section (or set electricity: null) to disable cost estimates.
electricity:
  timezone: America/New_York
  peak_rate: 0.32404
  off_peak_rate: 0.09336
  super_off_peak_rate: 0.06741
  delivery_rate: 0.10236
  peak_start_hour: 14
  peak_end_hour: 18
  super_off_peak_start_hour: 0
  super_off_peak_end_hour: 6
  peak_weekdays: [0, 1, 2, 3, 4]  # Monday=0; weekends use off-peak/overnight rates
  # PJM holidays: off-peak during the usual peak window. Maintain dates as needed.
  holidays:
    - "2026-01-01"
    - "2026-05-25"
    - "2026-07-04"
    - "2026-09-07"
    - "2026-11-26"
    - "2026-12-25"
    - "2027-01-01"
    - "2027-05-31"
    - "2027-07-04"
    - "2027-07-05"
    - "2027-09-06"
    - "2027-11-25"
    - "2027-12-25"

# Camera settings (1920x1080 default for Logitech C930e with hardware MJPG)
camera_device: "/dev/video0"
camera_device_index: 0
capture_width: 1920
capture_height: 1080

# Live preview is independent of the Full HD daily photo resolution.
stream_width: 1280
stream_height: 720

# Daily timelapse photo schedule
# Snaps 1 photo per day during the lights-on photoperiod (e.g. 22:00 = 10 PM if lights run overnight 20:00–06:00).
# Ensure daily_capture_hour falls during the tent's light cycle so images are well-illuminated.
daily_capture_hour: 22
daily_capture_minute: 0

# On-demand live stream framerate (keep low to save Pi Zero 2W CPU)
stream_fps: 5

# Maximum live stream session duration in seconds (default: 300 = 5 minutes)
stream_max_session_sec: 300

# Web server (port 80 allows opening http://citruspi.local directly)
host: "0.0.0.0"
port: 80
log_level: "info"

# Alerting & Heartbeats (ntfy.sh push notifications and dead-man's-snitch heartbeat ping)
# ntfy_topic and heartbeat_url can also be set via CITRUSPI_NTFY_TOPIC and CITRUSPI_HEARTBEAT_URL env vars.
ntfy_url: "https://ntfy.sh"
ntfy_topic: ""
heartbeat_url: ""

# Temperature thresholds (°F) and debounce count (consecutive readings required to trigger).
# NOTE: These thresholds assume the ~50°F winter phase and must be raised
# when the tent runs warmer (e.g. ~60°F staging).
temp_min_crit_f: 38.0
temp_min_warn_f: 44.0
temp_max_crit_f: 85.0
alert_debounce_count: 3

# AI Analysis (daily visual health analysis using Google Gemini; dashboard-only, never sends ntfy)
# ai_api_key can also be set via CITRUSPI_AI_API_KEY env var.
ai_enabled: false
ai_api_key: ""
ai_model: "gemini-3.8-flash"
# Optional names/positions matching the camera view; leave empty for findings by visible area.
plant_layout: ""

