<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🍊 CitrusPi{% block title_extra %}{% endblock %}</title>
    <!-- Instant theme sync before render to eliminate flash -->
    <script>
        const savedTheme = localStorage.getItem('citruspi-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="stylesheet" href="/static/style.css?v={{ static_version('style.css') }}">
    <script src="/static/vendor/htmx.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/htmx.org@2.0.4';"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="logo">
                <span class="logo-icon">🍊</span>
                <span class="logo-text">CitrusPi</span>
            </a>
            <div class="topbar-right">
                <nav class="nav-links">
                    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
                    <a href="/gallery" class="{% if '/gallery' in request.url.path %}active{% endif %}">Gallery</a>
                    <a href="/docs" target="_blank">API</a>
                </nav>
                <span id="wifi-badge" class="wifi" hidden>
                    <svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
                        <rect x="0" y="8" width="3" height="4" rx="0.5"/>
                        <rect x="4.3" y="5.5" width="3" height="6.5" rx="0.5"/>
                        <rect x="8.6" y="3" width="3" height="9" rx="0.5"/>
                        <rect x="12.9" y="0" width="3" height="12" rx="0.5"/>
                    </svg>
                    <span id="wifi-dbm"></span>
                </span>
                <button type="button" id="theme-toggle-btn" class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                    🌙
                </button>
            </div>
        </div>
    </header>
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>
    <script>
        function updateThemeButton() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) btn.textContent = isLight ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('citruspi-theme', next);
            updateThemeButton();
            if (typeof updateChartThemes === 'function') updateChartThemes();
        }
        updateThemeButton();

        async function refreshWifi() {
            const badge = document.getElementById('wifi-badge');
            try {
                const w = await (await fetch('/api/wifi')).json();
                badge.hidden = !w.available;
                if (!w.available) return;
                badge.dataset.bars = w.bars;
                badge.title = `Wi-Fi ${w.label}: ${w.dbm} dBm (${w.interface})`;
                document.getElementById('wifi-dbm').textContent = `${w.dbm} dBm`;
            } catch (e) { /* keep the last value */ }
        }
        refreshWifi();
        setInterval(refreshWifi, 30000);
    </script>
</body>
</html>
