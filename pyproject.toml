[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citruspi"
version = "0.1.0"
description = "Citrus overwintering monitor — sensors, camera, and a live dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alex" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "smbus2>=0.5",
]

[project.optional-dependencies]
dev = [
    "opencv-python-headless>=4.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
citruspi = "citruspi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citruspi"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
